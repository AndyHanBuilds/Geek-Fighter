<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera test</title>
<style>
  :root { --bg:#14172a; --card:#1f2340; --ink:#eef0ff; --dim:#98a0c8; --ok:#5be38b; --bad:#ff6b6b; --warn:#ffd166; --acc:#6fd0ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; padding:12px 16px 40px; }
  h1 { font-size:20px; margin:4px 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  button, label.btn { background:var(--acc); color:#06121c; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:700; }
  button.alt, label.btn { background:var(--card); color:var(--ink); border:1px solid #39407a; }
  button:disabled { opacity:.5; }
  #stage { position:relative; width:100%; max-width:480px; aspect-ratio:4/3; background:#000; border-radius:12px; overflow:hidden; }
  #stage video, #stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #stage.nomirror video, #stage.nomirror canvas { transform:none; }
  #flash { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:56px; font-weight:900; color:#fff; text-shadow:0 0 12px #f33; background:rgba(255,60,60,.25); transform:none !important; }
  .meters { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; max-width:480px; margin:8px 0; align-items:center; font-size:14px; }
  .bar { height:12px; background:#2c3160; border-radius:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#6fd0ff,#ff6b6b); }
  table { border-collapse:collapse; width:100%; max-width:480px; font-size:14px; }
  td { padding:4px 6px; border-bottom:1px solid #2c3160; vertical-align:top; }
  td:first-child { color:var(--dim); width:46%; }
  .pass { color:var(--ok); font-weight:700; } .fail { color:var(--bad); font-weight:700; } .wait { color:var(--warn); }
  pre { background:var(--card); padding:10px; border-radius:10px; overflow:auto; max-width:480px; font-size:12px; white-space:pre-wrap; }
  small { color:var(--dim); }
</style>
</head>
<body>
<h1>Camera and tracking test</h1>
<small>Everything runs on this device. Nothing is uploaded or saved.</small>

<div class="row">
  <button id="start">1. Start camera</button>
  <button id="flip" class="alt" disabled>Switch camera</button>
  <label class="btn">Test with a photo<input id="file" type="file" accept="image/*" hidden></label>
</div>

<div id="stage"><video id="vid" playsinline muted></video><canvas id="cv"></canvas><div id="flash">PUNCH!</div></div>

<div class="meters">
  <span>Rage</span><div class="bar"><i id="rage"></i></div>
  <span>Fist speed</span><div class="bar"><i id="spd"></i></div>
  <span>Fist growth</span><div class="bar"><i id="grow"></i></div>
</div>

<h2 style="font-size:17px;margin:12px 0 4px">Results</h2>
<table id="res"></table>

<div class="row"><button id="copy" class="alt">Copy results</button></div>
<pre id="out"></pre>

<script type="module">
const V = '0.10.21';   // pinned: newer web builds send usage logs to Google
const BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}`;
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const R = {};          // results shown in the table: key -> {v, s}  (s: pass/fail/wait)
const order = [];
function set(key, v, s = 'wait') { if (!(key in R)) order.push(key); R[key] = { v: String(v), s }; render(); }
function render() {
  $('res').innerHTML = order.map(k => `<tr><td>${k}</td><td class="${R[k].s}">${R[k].v}</td></tr>`).join('');
  $('out').textContent = order.map(k => `${k}: ${R[k].v} [${R[k].s}]`).join('\n');
}

// ---- environment ----
const inIframe = window.self !== window.top;
set('page is secure (https)', window.isSecureContext, window.isSecureContext ? 'pass' : 'fail');
set('inside an iframe (embedded)', inIframe, 'wait');
set('device', /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iPhone/iPad' : /Android/.test(navigator.userAgent) ? 'Android' : 'computer', 'wait');
set('screen', `${screen.width}x${screen.height} @${devicePixelRatio}x`, 'wait');
set('camera API present', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'pass' : 'fail');
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'camera' }).then(p => set('camera permission before asking', p.state, 'wait')).catch(() => {});
}

// ---- tracking state ----
let vision, face, hand, stream, facing = 'user', running = false;
let fFrames = 0, hFrames = 0, t0 = 0, lastTs = -1;
let punches = 0, lastPunch = 0, prev = null;
let peakSpeed = 0, peakGrow = 0, faceSeen = 0, handSeen = 0;
const ctx = $('cv').getContext('2d');

async function loadLibs() {
  if (vision) return;
  let t = performance.now();
  try {
    const m = await import(`${BASE}/vision_bundle.mjs`);
    set('library loaded', `${Math.round(performance.now() - t)} ms (v${V})`, 'pass');
    t = performance.now();
    vision = { m, files: await m.FilesetResolver.forVisionTasks(`${BASE}/wasm`) };
    set('wasm runtime loaded', `${Math.round(performance.now() - t)} ms`, 'pass');
  } catch (e) { set('library loaded', 'FAILED: ' + e, 'fail'); throw e; }
  async function make(cls, model, opts, name) {
    for (const delegate of ['GPU', 'CPU']) {
      const t1 = performance.now();
      try {
        const inst = await cls.createFromOptions(vision.files, { baseOptions: { modelAssetPath: model, delegate }, ...opts });
        set(`${name} model ready`, `${Math.round(performance.now() - t1)} ms on ${delegate}`, 'pass');
        return inst;
      } catch (e) { set(`${name} model ready`, `${delegate} failed: ${String(e).slice(0, 80)}`, delegate === 'CPU' ? 'fail' : 'wait'); }
    }
  }
  face = await make(vision.m.FaceLandmarker, FACE_MODEL, { runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true }, 'face');
  hand = await make(vision.m.HandLandmarker, HAND_MODEL, { runningMode: 'VIDEO', numHands: 2 }, 'hand');
}

async function startCamera() {
  $('start').disabled = true;
  set('camera request', 'asking...', 'wait');
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    $('vid').srcObject = stream; await $('vid').play();
    const s = stream.getVideoTracks()[0].getSettings();
    set('camera request', 'allowed', 'pass');
    set('camera stream', `${s.width}x${s.height} @${Math.round(s.frameRate || 0)}fps, ${s.facingMode || facing}`, 'pass');
    $('stage').classList.toggle('nomirror', facing !== 'user');
    $('flip').disabled = false;
  } catch (e) {
    set('camera request', `${e.name}: ${e.message}`, 'fail');
    if (inIframe) set('hint', 'Embedded pages need permission from the host page. Try the direct link (opens fullscreen).', 'wait');
    $('start').disabled = false; return;
  }
  try { await loadLibs(); } catch { return; }
  $('cv').width = $('vid').videoWidth; $('cv').height = $('vid').videoHeight;
  if (!running) { running = true; t0 = performance.now(); fFrames = hFrames = 0; requestAnimationFrame(loop); }
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function loop() {
  if (!running) return;
  const v = $('vid');
  if (v.readyState >= 2) {
    const ts = performance.now();
    if (ts > lastTs) {
      lastTs = ts;
      ctx.clearRect(0, 0, $('cv').width, $('cv').height);
      if (face) {
        const r = face.detectForVideo(v, ts); fFrames++;
        if (r.faceLandmarks && r.faceLandmarks.length) {
          faceSeen++; drawPoints(r.faceLandmarks[0], '#6fd0ff', 1.5);
          const bs = {}; (r.faceBlendshapes[0]?.categories || []).forEach(c => bs[c.categoryName] = c.score);
          const rage = Math.min(1, ((bs.browDownLeft || 0) + (bs.browDownRight || 0)) / 2 * 1.3 + ((bs.noseSneerLeft || 0) + (bs.noseSneerRight || 0)) / 2 * .6 + ((bs.mouthFrownLeft || 0) + (bs.mouthFrownRight || 0)) / 2 * .5);
          $('rage').style.width = (rage * 100) + '%';
          const top = Object.entries(bs).filter(([k]) => !k.startsWith('_')).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, x]) => `${k} ${x.toFixed(2)}`).join(', ');
          set('face', `found, ${r.faceLandmarks[0].length} points`, 'pass');
          set('expression (top 3)', top, 'pass');
          set('head matrix', r.facialTransformationMatrixes?.length ? 'yes' : 'no', r.facialTransformationMatrixes?.length ? 'pass' : 'fail');
        } else set('face', 'not visible', faceSeen ? 'wait' : 'wait');
      }
      if (hand) {
        const r = hand.detectForVideo(v, ts); hFrames++;
        if (r.landmarks && r.landmarks.length) {
          handSeen++;
          const L = r.landmarks[0]; drawPoints(L, '#ffd166', 3);
          const scale = dist(L[0], L[9]);                       // wrist to middle knuckle: grows as the hand nears the camera
          const cx = L[9].x, cy = L[9].y;
          if (prev) {
            const dt = (ts - prev.ts) / 1000;
            if (dt > 0.005) {
              const speed = Math.hypot(cx - prev.cx, cy - prev.cy) / dt;     // screen widths per second
              const grow = (scale - prev.scale) / prev.scale / dt;           // relative growth per second
              peakSpeed = Math.max(peakSpeed, speed); peakGrow = Math.max(peakGrow, grow);
              $('spd').style.width = Math.min(100, speed * 25) + '%';
              $('grow').style.width = Math.max(0, Math.min(100, grow * 25)) + '%';
              if ((speed > 2.2 || grow > 2.0) && ts - lastPunch > 450) {
                lastPunch = ts; punches++; flash();
                set('punches detected', punches, 'pass');
              }
            }
          }
          prev = { ts, cx, cy, scale };
          set('hand', `found, speed peak ${peakSpeed.toFixed(1)}, growth peak ${peakGrow.toFixed(1)}`, 'pass');
        } else { prev = null; set('hand', 'not visible', 'wait'); }
      }
      const secs = (performance.now() - t0) / 1000;
      if (secs > 1) set('tracking speed', `face+hand loop ${(fFrames / secs).toFixed(1)} fps`, fFrames / secs >= 12 ? 'pass' : 'fail');
    }
  }
  requestAnimationFrame(loop);
}

function drawPoints(pts, color, r) {
  const w = $('cv').width, h = $('cv').height; ctx.fillStyle = color;
  for (const p of pts) { ctx.fillRect(p.x * w - r / 2, p.y * h - r / 2, r, r); }
}
function flash() { const f = $('flash'); f.style.display = 'flex'; setTimeout(() => f.style.display = 'none', 250); if (navigator.vibrate) navigator.vibrate(60); }

// ---- photo mode (also tests the file picker) ----
async function photo(url) {
  await loadLibs();
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
  const mk = async (cls, model, opts) => cls.createFromOptions(vision.files, { baseOptions: { modelAssetPath: model, delegate: 'CPU' }, ...opts });
  const fl = await mk(vision.m.FaceLandmarker, FACE_MODEL, { runningMode: 'IMAGE', numFaces: 1, outputFaceBlendshapes: true });
  const hl = await mk(vision.m.HandLandmarker, HAND_MODEL, { runningMode: 'IMAGE', numHands: 2 });
  const fr = fl.detect(img), hr = hl.detect(img);
  const out = { faces: fr.faceLandmarks.length, points: fr.faceLandmarks[0]?.length || 0, blendshapes: fr.faceBlendshapes[0]?.categories.length || 0,
                top: (fr.faceBlendshapes[0]?.categories || []).filter(c => !c.categoryName.startsWith('_')).sort((a, b) => b.score - a.score).slice(0, 3).map(c => c.categoryName + ' ' + c.score.toFixed(2)),
                hands: hr.landmarks.length, handPoints: hr.landmarks[0]?.length || 0 };
  set('photo test', `faces ${out.faces} (${out.points} pts, ${out.blendshapes} expressions), hands ${out.hands}`, out.faces || out.hands ? 'pass' : 'fail');
  set('photo expression (top 3)', out.top.join(', '), 'pass');
  return out;
}
window.__photo = photo;

$('start').onclick = startCamera;
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };
$('file').onchange = e => { const f = e.target.files[0]; if (f) photo(URL.createObjectURL(f)).catch(err => set('photo test', 'FAILED: ' + err, 'fail')); };
$('copy').onclick = async () => { try { await navigator.clipboard.writeText($('out').textContent); $('copy').textContent = 'Copied'; } catch { $('copy').textContent = 'Select the text below and copy it'; } };
render();
</script>
</body>
</html>
