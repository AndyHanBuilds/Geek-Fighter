<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Punch</title>
<style>
  html, body { margin:0; height:100%; background:#10131f; color:#fff; font:16px system-ui, sans-serif; overflow:hidden; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; left:0; right:0; top:0; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, label.b { background:#ffd23f; color:#1a1300; border:0; border-radius:10px; padding:10px 14px; font-weight:800; font-size:15px; }
  button.alt, label.b.alt { background:#262b4a; color:#fff; border:1px solid #444b86; }
  #hp { position:absolute; left:12px; right:12px; bottom:14px; height:16px; background:#2b2f4d; border-radius:9px; overflow:hidden; }
  #hp i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff4d4d,#ffd23f 60%,#5be38b); transition:width .12s; }
  #msg { position:absolute; left:0; right:0; top:42%; text-align:center; font-size:64px; font-weight:900; text-shadow:0 4px 0 #0008, 0 0 24px #f55; pointer-events:none; opacity:0; }
  #info { position:absolute; left:12px; bottom:40px; font-size:13px; color:#c8cdf0; text-shadow:0 1px 3px #000; pointer-events:none; white-space:pre; }
  #cam { position:absolute; right:10px; bottom:40px; width:120px; border-radius:8px; transform:scaleX(-1); opacity:.85; display:none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="ui">
    <label class="b">Pick a photo<input id="file" type="file" accept="image/*" hidden></label>
    <button id="camBtn" class="alt">Use camera</button>
    <button id="scanBtn" class="alt" disabled>Scan face</button>
  </div>
  <div id="msg"></div>
  <div id="info">Pick a photo of a face (yours, or a friend who agrees), or start the camera.
Then tap or drag to punch.</div>
  <video id="cam" playsinline muted></video>
  <div id="hp"><i id="hpbar"></i></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
