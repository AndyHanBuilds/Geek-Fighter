<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Punch</title>
<style>
  html, body { margin:0; height:100%; background:#10131f; color:#fff; font:16px system-ui, sans-serif; overflow:hidden; touch-action:none; }
  #app { position:fixed; inset:0; }
  canvas#gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; left:0; right:0; top:0; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, label.b { background:#ffd23f; color:#1a1300; border:0; border-radius:10px; padding:10px 14px; font-weight:800; font-size:15px; }
  button.alt, label.b.alt { background:#262b4a; color:#fff; border:1px solid #444b86; }
  #hp { position:absolute; left:12px; right:12px; bottom:14px; height:16px; background:#2b2f4d; border-radius:9px; overflow:hidden; }
  #hp i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff4d4d,#ffd23f 60%,#5be38b); transition:width .12s; }
  #msg { position:absolute; left:0; right:0; top:42%; text-align:center; font-size:64px; font-weight:900; text-shadow:0 4px 0 #0008, 0 0 24px #f55; pointer-events:none; opacity:0; }
  #info { position:absolute; left:12px; bottom:40px; font-size:13px; color:#c8cdf0; text-shadow:0 1px 3px #000; pointer-events:none; white-space:pre; }
  #cam { position:absolute; right:10px; bottom:40px; width:120px; border-radius:8px; transform:scaleX(-1); opacity:.85; display:none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="ui">
    <label class="b">Pick a photo<input id="file" type="file" accept="image/*" hidden></label>
    <button id="camBtn" class="alt">Use camera</button>
    <button id="scanBtn" class="alt" disabled>Scan face</button>
  </div>
  <div id="msg"></div>
  <div id="info">Pick a photo of a face (yours, or a friend who agrees), or start the camera.
Then tap or drag to punch.</div>
  <video id="cam" playsinline muted></video>
  <div id="hp"><i id="hpbar"></i></div>
</div>

<script type="module">
import * as THREE from 'three';
import Delaunator from 'https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm';

const V = '0.10.21';   // pinned: newer web builds send usage logs
const BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}`;
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const $ = id => document.getElementById(id);
const info = t => { $('info').textContent = t; };

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#10131f');
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50); camera.position.set(0, 0, 7);
const headGroup = new THREE.Group(); scene.add(headGroup);
let VIEW_H = 2 * Math.tan(THREE.MathUtils.degToRad(35 / 2)) * 7, VIEW_W = VIEW_H;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  VIEW_H = 2 * Math.tan(THREE.MathUtils.degToRad(35 / 2)) * 7; VIEW_W = VIEW_H * camera.aspect;
  // keep the face fully visible on tall phone screens
  camera.position.z = Math.max(7, 7 * (3.0 / VIEW_W));
}
addEventListener('resize', resize); resize();

// fist marker (hand punches)
const fist = new THREE.Mesh(new THREE.SphereGeometry(0.35, 20, 16), new THREE.MeshBasicMaterial({ color: '#ffd23f' }));
fist.visible = false; fist.position.z = 1; scene.add(fist);

// ---------- face mesh ----------
let mesh = null, geo = null, N = 0, base, off, vel, uvs, tri, nbr, bruise, colors, tex;
const HALF_W = 1.0;                       // face is 2 units wide
let faceWidthScale = 1;

function buildMesh(lm, aspect, texture) {
  N = 468;
  const pts2 = new Float64Array(N * 2);
  for (let i = 0; i < N; i++) { pts2[2 * i] = lm[i].x * aspect; pts2[2 * i + 1] = lm[i].y; }
  const d = new Delaunator(pts2);
  let w = 0, minx = 9, maxx = -9;
  for (let i = 0; i < N; i++) { minx = Math.min(minx, pts2[2 * i]); maxx = Math.max(maxx, pts2[2 * i]); }
  w = maxx - minx;
  const keep = [];
  for (let t = 0; t < d.triangles.length; t += 3) {
    const a = d.triangles[t], b = d.triangles[t + 1], c = d.triangles[t + 2];
    const e = (p, q) => Math.hypot(pts2[2 * p] - pts2[2 * q], pts2[2 * p + 1] - pts2[2 * q + 1]);
    if (Math.max(e(a, b), e(b, c), e(c, a)) < 0.30 * w) keep.push(a, b, c);
  }
  tri = new Uint32Array(keep);
  uvs = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) { uvs[2 * i] = lm[i].x; uvs[2 * i + 1] = 1 - lm[i].y; }
  base = new Float32Array(N * 3); off = new Float32Array(N * 3); vel = new Float32Array(N * 3);
  bruise = new Float32Array(N); colors = new Float32Array(N * 3).fill(1);
  // neighbour lists
  const sets = Array.from({ length: N }, () => new Set());
  for (let t = 0; t < tri.length; t += 3) { const [a, b, c] = [tri[t], tri[t + 1], tri[t + 2]]; sets[a].add(b).add(c); sets[b].add(a).add(c); sets[c].add(a).add(b); }
  nbr = sets.map(s => Array.from(s));
  geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setIndex(new THREE.BufferAttribute(tri, 1));
  const mat = new THREE.MeshBasicMaterial({ map: texture, vertexColors: true, side: THREE.DoubleSide });
  if (mesh) { headGroup.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; headGroup.add(mesh);
  setBaseFromLandmarks(lm, aspect);
}

// landmarks -> centred, scaled scene positions (face width = 2 units); z grows toward the camera
function setBaseFromLandmarks(lm, aspect) {
  let cx = 0, cy = 0, cz = 0, minx = 9, maxx = -9;
  for (let i = 0; i < N; i++) { cx += lm[i].x; cy += lm[i].y; cz += lm[i].z; minx = Math.min(minx, lm[i].x); maxx = Math.max(maxx, lm[i].x); }
  cx /= N; cy /= N; cz /= N;
  const k = 2 / ((maxx - minx) * aspect);
  for (let i = 0; i < N; i++) {
    base[3 * i] = (lm[i].x - cx) * aspect * k;
    base[3 * i + 1] = -(lm[i].y - cy) * k;
    base[3 * i + 2] = -(lm[i].z - cz) * aspect * k * 1.1;
  }
}

// ---------- jelly physics ----------
const K = 150, C = 5.5, KN = 70;     // spring, damping, neighbour coupling
const head = { rx: 0, ry: 0, vx: 0, vy: 0, px: 0, py: 0, pz: 0, vpx: 0, vpy: 0, vpz: 0 };
let hitStop = 0, shake = 0, hp = 100, combo = 0, lastHit = 0, ko = 0;
const P = new THREE.Vector3();

function hit(px, py, dx, dy, strength) {
  if (!mesh || ko > 0) return;
  strength = Math.max(0.35, Math.min(1.8, strength));
  const sig = 0.55;
  let n = 0;
  for (let i = 0; i < N; i++) {
    const x = base[3 * i] + off[3 * i], y = base[3 * i + 1] + off[3 * i + 1];
    const d2 = (x - px) ** 2 + (y - py) ** 2;
    const w = Math.exp(-d2 / (sig * sig));
    if (w < 0.01) continue;
    vel[3 * i] += dx * strength * w * 6; vel[3 * i + 1] += dy * strength * w * 6; vel[3 * i + 2] -= strength * w * 16;
    bruise[i] = Math.min(1, bruise[i] + w * 0.55 * strength); n++;
  }
  head.vx += -py * strength * 5 + dy * strength * 3;   // tilt away from the blow
  head.vy += px * strength * 5 + dx * strength * 3;
  head.vpz -= strength * 4; head.vpx += dx * strength * 3; head.vpy += dy * strength * 3;
  hitStop = 0.05 + 0.04 * strength; shake = 0.12 * strength;
  const now = performance.now(); combo = now - lastHit < 900 ? combo + 1 : 1; lastHit = now;
  hp = Math.max(0, hp - strength * 9); $('hpbar').style.width = hp + '%';
  pop(['POW!', 'BAM!', 'WHAM!', 'BONK!', 'SMACK!'][(Math.random() * 5) | 0] + (combo > 2 ? ` x${combo}` : ''));
  thud(strength);
  if (hp <= 0) { ko = 2.2; pop('K.O.!', 1800); head.vpz -= 8; head.vx += 14; }
}

function stepPhysics(dt) {
  dt = Math.min(dt, 1 / 30);
  const sub = 2, h = dt / sub;
  for (let s = 0; s < sub; s++) {
    for (let i = 0; i < N; i++) {
      for (let a = 0; a < 3; a++) {
        const idx = 3 * i + a;
        let acc = -K * off[idx] - C * vel[idx];
        let avg = 0; const L = nbr[i];
        for (let j = 0; j < L.length; j++) avg += off[3 * L[j] + a];
        acc += KN * (avg / L.length - off[idx]);
        vel[idx] += acc * h;
      }
    }
    for (let i = 0; i < 3 * N; i++) off[i] += vel[i] * h;
    // rigid head springs
    head.vx += (-60 * head.rx - 5 * head.vx) * h; head.rx += head.vx * h;
    head.vy += (-60 * head.ry - 5 * head.vy) * h; head.ry += head.vy * h;
    head.vpx += (-50 * head.px - 5 * head.vpx) * h; head.px += head.vpx * h;
    head.vpy += (-50 * head.py - 5 * head.vpy) * h; head.py += head.vpy * h;
    head.vpz += (-50 * head.pz - 5 * head.vpz) * h; head.pz += head.vpz * h;
  }
  for (let i = 0; i < N; i++) {
    bruise[i] = Math.max(0, bruise[i] - dt * 0.12);
    const b = bruise[i]; colors[3 * i] = 1; colors[3 * i + 1] = 1 - 0.55 * b; colors[3 * i + 2] = 1 - 0.65 * b;
  }
}

function syncGeometry() {
  const pos = geo.attributes.position.array;
  for (let i = 0; i < 3 * N; i++) pos[i] = base[i] + off[i];
  geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  headGroup.rotation.set(THREE.MathUtils.clamp(head.rx, -0.35, 0.35), THREE.MathUtils.clamp(head.ry, -0.35, 0.35), 0);
  headGroup.position.set(head.px, head.py, head.pz);
}

// ---------- sound (made in the browser, no files) ----------
let actx;
function thud(s) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(170 + 60 * s, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    const nb = actx.createBuffer(1, actx.sampleRate * 0.08, actx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const ns = actx.createBufferSource(), ng = actx.createGain(); ns.buffer = nb; ng.gain.value = 0.35; ns.connect(ng).connect(actx.destination); ns.start(t);
  } catch (e) {}
}
let popTimer = 0;
function pop(text, ms = 420) { const m = $('msg'); m.textContent = text; m.style.opacity = 1; m.style.transform = `scale(${1 + Math.random() * .25}) rotate(${(Math.random() - .5) * 14}deg)`; clearTimeout(popTimer); popTimer = setTimeout(() => m.style.opacity = 0, ms); }

// ---------- input: tap / drag punches ----------
let ptr = null;
function toPlane(clientX, clientY) {
  const x = (clientX / innerWidth - 0.5) * 2, y = -(clientY / innerHeight - 0.5) * 2;
  const ray = new THREE.Raycaster(); ray.setFromCamera({ x, y }, camera);
  const t = -ray.ray.origin.z / ray.ray.direction.z; ray.ray.at(t, P); return P.clone();
}
$('gl').addEventListener('pointerdown', e => {
  const p = toPlane(e.clientX, e.clientY); ptr = { x: e.clientX, y: e.clientY, t: performance.now() };
  hit(p.x, p.y, 0, 0, 0.9);
});
$('gl').addEventListener('pointermove', e => {
  if (!ptr || e.buttons === 0 && e.pointerType === 'mouse') return;
  const now = performance.now(), dt = (now - ptr.t) / 1000;
  const vx = (e.clientX - ptr.x) / dt, vy = (e.clientY - ptr.y) / dt, sp = Math.hypot(vx, vy);
  if (sp > 1400 && dt > 0.03) {
    const p = toPlane(e.clientX, e.clientY);
    hit(p.x, p.y, vx / sp, -vy / sp, sp / 1600);
  }
  ptr = { x: e.clientX, y: e.clientY, t: now };
});
addEventListener('pointerup', () => { ptr = null; });

// ---------- MediaPipe ----------
let vision, faceLM, handLM, faceVideo, faceImg;
async function libs() {
  if (vision) return;
  info('Loading tracking models (about 21 MB)...');
  const m = await import(`${BASE}/vision_bundle.mjs`);
  const files = await m.FilesetResolver.forVisionTasks(`${BASE}/wasm`);
  const mk = async (cls, model, opts) => { for (const delegate of ['GPU', 'CPU']) { try { return await cls.createFromOptions(files, { baseOptions: { modelAssetPath: model, delegate }, ...opts }); } catch (e) { if (delegate === 'CPU') throw e; } } };
  vision = { m };
  faceLM = await mk(m.FaceLandmarker, FACE_MODEL, { runningMode: 'IMAGE', numFaces: 1 });
  handLM = null;
  vision.mk = mk;
}
async function loadPhoto(url) {
  await libs();
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
  const r = faceLM.detect(img);
  if (!r.faceLandmarks.length) { info('No face found in that photo. Try a clear, front-facing one.'); return false; }
  const t = new THREE.Texture(img); t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  buildMesh(r.faceLandmarks[0], img.width / img.height, t);
  hp = 100; ko = 0; $('hpbar').style.width = '100%';
  info('Head ready. Tap or drag fast across it to punch.'); return true;
}
window.__loadPhoto = loadPhoto;
$('file').onchange = e => { const f = e.target.files[0]; if (f) loadPhoto(URL.createObjectURL(f)).catch(err => info('Failed: ' + err)); };

// ---------- live camera: scan once, then expressions + hand punches ----------
let live = false, videoLM = null, prevHand = null, lastPunch = 0;
$('camBtn').onclick = async () => {
  try {
    await libs();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    faceVideo = $('cam'); faceVideo.srcObject = stream; await faceVideo.play(); faceVideo.style.display = 'block';
    info('Loading live tracking...');
    videoLM = await vision.mk(vision.m.FaceLandmarker, FACE_MODEL, { runningMode: 'VIDEO', numFaces: 1 });
    handLM = await vision.mk(vision.m.HandLandmarker, HAND_MODEL, { runningMode: 'VIDEO', numHands: 1 });
    $('scanBtn').disabled = false; live = true; info('Camera on. Look at the camera and press Scan face.');
  } catch (e) { info('Camera problem: ' + e.name + ' ' + e.message + '\nYou can still use a photo.'); }
};
$('scanBtn').onclick = () => {
  const v = faceVideo, c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0);   // mirror so left/right feel natural
  const r = faceLM.detect(c);
  if (!r.faceLandmarks.length) { info('No face found. Move closer and face the camera.'); return; }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  buildMesh(r.faceLandmarks[0], c.width / c.height, t); hp = 100; ko = 0; $('hpbar').style.width = '100%';
  info('Scanned! Move your face, then punch toward the camera.');
};
function liveStep(ts) {
  if (!live || !mesh || faceVideo.readyState < 2) return;
  const r = videoLM.detectForVideo(faceVideo, ts);
  if (r.faceLandmarks.length) {
    const lm = r.faceLandmarks[0].map(p => ({ x: 1 - p.x, y: p.y, z: p.z }));      // mirrored like the scan
    setBaseFromLandmarks(lm, faceVideo.videoWidth / faceVideo.videoHeight);
  }
  const h = handLM.detectForVideo(faceVideo, ts);
  if (h.landmarks.length) {
    const L = h.landmarks[0], hx = 1 - L[9].x, hy = L[9].y, scale = Math.hypot(L[0].x - L[9].x, L[0].y - L[9].y);
    const sx = (hx - 0.5) * VIEW_W, sy = -(hy - 0.5) * VIEW_H;
    fist.visible = true; fist.position.set(sx, sy, 1); fist.scale.setScalar(0.6 + scale * 6);
    if (prevHand) {
      const dt = (ts - prevHand.ts) / 1000;
      if (dt > 0.005) {
        const sp = Math.hypot(hx - prevHand.x, hy - prevHand.y) / dt, gr = (scale - prevHand.s) / prevHand.s / dt;
        if ((sp > 2.2 || gr > 2.0) && ts - lastPunch > 450) {
          lastPunch = ts; const dx = hx - prevHand.x, dy = -(hy - prevHand.y), m = Math.hypot(dx, dy) || 1;
          hit(sx, sy, dx / m * 0.5, dy / m * 0.5, Math.max(sp / 3, gr / 3));
        }
      }
    }
    prevHand = { ts, x: hx, y: hy, s: scale };
  } else { fist.visible = false; prevHand = null; }
}

// ---------- main loop ----------
let last = performance.now();
function frame(ts) {
  const dt = (ts - last) / 1000; last = ts;
  if (mesh) {
    if (live) liveStep(ts);
    if (hitStop > 0) hitStop -= dt; else stepPhysics(dt);
    if (ko > 0) { ko -= dt; if (ko <= 0) { hp = 100; $('hpbar').style.width = '100%'; pop('BOUNCE BACK!', 1400); head.vpz += 6; } }
    syncGeometry();
  }
  shake = Math.max(0, shake - dt * 0.6);
  camera.position.x = (Math.random() - .5) * shake; camera.position.y = (Math.random() - .5) * shake;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
